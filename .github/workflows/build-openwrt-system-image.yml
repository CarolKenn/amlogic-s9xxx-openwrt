#============================================================================================
# 斐讯 N1（Amlogic S905D）专用构建
# 源码固定：immortalwrt / openwrt-24.10（opkg 生态完整，第三方插件与 kmod 兼容性最好）
# 打包：ophub/amlogic-s9xxx-openwrt，openwrt_board 固定 s905d
#      模型库里 BOARD=s905d 且 BUILD=yes 只有 Phicomm-N1 一条，不会带出其它硬件
#============================================================================================

name: Build OpenWrt for Phicomm N1

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: "SSH 连接到 Actions 调试"
        required: false
        default: false
        type: boolean
      openwrt_ip:
        description: "固件默认 LAN 地址（旁路由地址）"
        required: false
        default: "192.168.128.3"
      openwrt_kernel:
        description: "内核版本"
        required: false
        default: "6.6.y"
        type: choice
        options:
          - 6.6.y
          - 5.15.y
          - 6.12.y
      kernel_usage:
        description: "内核标签"
        required: false
        default: "flippy"
        type: choice
        options:
          - flippy
          - stable
      openwrt_size:
        description: "镜像分区大小 boot/rootfs（MiB）"
        required: false
        default: "384/2048"
      use_ccache:
        description: "启用 ccache 加速编译"
        required: false
        default: true
        type: boolean

env:
  TZ: Asia/Shanghai
  CCACHE_DIR: /builder/openwrt/.ccache

  # 源码：只这一条分支
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  REPO_NAME: immortalwrt
  CONFIG_FILE: config/immortalwrt_openwrt-24.10/config
  DIY_P1_SH: config/immortalwrt_openwrt-24.10/diy-part1.sh
  DIY_P2_SH: config/immortalwrt_openwrt-24.10/diy-part2.sh

  # 只出 N1
  OPENWRT_BOARD: s905d
  BUILD_TAG: OpenWrt_24.10

  # 手动触发时用输入值；repository_dispatch 没有输入，回落到默认值
  OPENWRT_IP: ${{ inputs.openwrt_ip || '192.168.128.3' }}
  KERNEL_VERSION: ${{ inputs.openwrt_kernel || '6.6.y' }}
  KERNEL_USAGE: ${{ inputs.kernel_usage || 'flippy' }}
  IMAGE_SIZE: ${{ inputs.openwrt_size || '384/2048' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 初始化编译环境
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-make-openwrt-depends)
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Asia/Shanghai}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          date
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: 创建扩展存储虚拟盘
        id: disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }

          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"

          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: 克隆 ImmortalWrt 源码 [ ${{ env.REPO_BRANCH }} ]
        id: codes
        working-directory: /builder
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          git clone -q --single-branch --depth=1 --branch="${REPO_BRANCH}" "${REPO_URL}" openwrt
          ln -sf /builder/openwrt ${{ github.workspace }}/openwrt
          # 打包动作要在自己的目录里能看到源码
          ln -sf /builder/openwrt /home/runner/work/_actions/ophub/amlogic-s9xxx-openwrt/main/openwrt

          echo "REPO_URL=${REPO_URL}" >> ${GITHUB_ENV}
          echo "REPO_NAME=${REPO_NAME}" >> ${GITHUB_ENV}
          echo "REPO_BRANCH=${REPO_BRANCH}" >> ${GITHUB_ENV}
          df -hT ${PWD}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: feeds 前置处理（diy-part1）
        run: |
          chmod +x ${DIY_P1_SH}
          cd openwrt/
          ${{ github.workspace }}/${DIY_P1_SH}

      - name: 更新并安装 feeds
        run: |
          cd openwrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载 N1 配置（diy-part2）
        run: |
          [[ -d "files" ]] && mv -f files openwrt/files
          [[ -e "${CONFIG_FILE}" ]] || { echo "!! 缺少 ${CONFIG_FILE}" >&2; exit 1; }
          cp -f ${CONFIG_FILE} openwrt/.config
          chmod +x ${DIY_P2_SH}
          cd openwrt/
          use_ccache="${{ inputs.use_ccache }}"
          [[ -n "${use_ccache}" ]] || use_ccache=true
          ${{ github.workspace }}/${DIY_P2_SH} "${OPENWRT_IP}" "${use_ccache}"

      - name: 下载软件包并校验配置
        id: package
        run: |
          cd openwrt/
          make defconfig

          # rootfs.tar.gz 是 amlogic 打包的唯一输入；Docker 与硬盘共享是这台机器的用途
          missing=0
          for key in CONFIG_TARGET_ROOTFS_TARGZ CONFIG_PACKAGE_dockerd CONFIG_PACKAGE_containerd \
                     CONFIG_PACKAGE_samba4-server CONFIG_PACKAGE_kmod-usb-storage \
                     CONFIG_PACKAGE_kmod-fs-ntfs3 CONFIG_PACKAGE_kmod-fs-exfat \
                     CONFIG_PACKAGE_luci-app-dockerman CONFIG_PACKAGE_luci-app-samba4; do
            grep -q "^${key}=y$" .config || { echo "!! 配置缺项: ${key}" >&2; missing=1; }
          done
          [ "${missing}" -eq 0 ] || exit 1
          echo "配置校验通过"

          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: SSH 连接到 Actions
        uses: P3TERX/ssh2actions@main
        if: ${{ github.event.inputs.ssh == 'true' && !cancelled() }}
        continue-on-error: true

      - name: 取源码 commit hash
        id: openwrthash
        run: |
          repo_path="$(echo "${REPO_URL}" | awk -F"github.com/" '{print $2}')"
          api_url="https://api.github.com/repos/${repo_path}/git/ref/heads/${REPO_BRANCH}"
          source_hash=$(curl -fsSL -m 20 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              ${api_url} | jq -r '.object.sha')
          [[ -z "${source_hash}" || "${source_hash}" == "null" ]] && source_hash="${{ github.sha }}"
          echo "source_hash=${source_hash}" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: 缓存 ccache
        uses: actions/cache@v5
        with:
          path: /builder/openwrt/.ccache
          key: openwrt-immortalwrt-24.10-${{ env.source_hash }}
          restore-keys: |
            openwrt-immortalwrt-24.10-

      - name: 编译固件
        id: compile
        run: |
          cd openwrt/
          echo -e "Compiling with $(nproc) threads"
          make -j$(($(nproc) + 1)) V=s || make -j1 || make -j1 V=s
          ccache -s 2>/dev/null || true
          du -sh $(pwd)/.ccache 2>/dev/null || true
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: 校验并清理产物
        id: clean
        if: ${{ steps.compile.outputs.status == 'success' && !cancelled() }}
        run: |
          cd openwrt/
          ls -alh bin/targets/armsr/armv8/ || true
          # 24.10 的产物名叫 immortalwrt-armsr-armv8-rootfs.tar.gz，没有 -generic- 前缀
          compgen -G "bin/targets/armsr/armv8/*rootfs.tar.gz" > /dev/null || {
            echo "!! 未生成 rootfs.tar.gz，检查 CONFIG_TARGET_ROOTFS_TARGZ" >&2; exit 1; }

          [[ -d "output" ]] || mkdir output
          cp -f bin/targets/armsr/armv8/*rootfs.tar.gz output/
          cp -f .config output/config

          ls -A | grep -vE '^(output|\.ccache)$' | xargs rm -rf || true
          df -hT ${PWD}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: 上传 rootfs 到 Release
        uses: ophub/upload-to-releases@main
        if: ${{ steps.clean.outputs.status == 'success' && !cancelled() }}
        with:
          tag: ${{ env.BUILD_TAG }}
          artifacts: openwrt/output/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包 N1 镜像
        if: ${{ steps.clean.outputs.status == 'success' && !cancelled() }}
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/output/*rootfs.tar.gz
          openwrt_board: ${{ env.OPENWRT_BOARD }}
          openwrt_kernel: ${{ env.KERNEL_VERSION }}
          auto_kernel: true
          kernel_repo: ophub/kernel
          kernel_usage: ${{ env.KERNEL_USAGE }}
          openwrt_ip: ${{ env.OPENWRT_IP }}
          openwrt_size: ${{ env.IMAGE_SIZE }}

      - name: 上传固件到 Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: ${{ env.BUILD_TAG }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### 斐讯 N1 固件信息
            - 源码：immortalwrt / `${{ env.REPO_BRANCH }}`
            - 内核：`${{ env.KERNEL_VERSION }}`（${{ env.KERNEL_USAGE }}）
            - 默认地址：`${{ env.OPENWRT_IP }}`（LuCI 端口 8080）
            - 默认账号：`root` / `password`（首次登录请立即修改）
            - 无线：默认禁用（N1 单频，旁路由用不上）

            ### 已内置
            - Docker（数据目录建议切到移动硬盘：`n1-storage docker-on-disk`）
            - samba4 文件共享：`\\${{ env.OPENWRT_IP }}\movie` → `/mnt/movie`
            - NTFS3 / exFAT / f2fs，外接移动硬盘即插即用
            - HomeProxy（sing-box）、DDNS-Go、晶晨宝盒（装 eMMC / 在线升级）

            ### 写入 eMMC
            - 系统 → 晶晨宝盒 → 安装 OpenWrt
            - 建议先用 U 盘跑一周，确认稳定再写 eMMC

            ### 说明
            - 本仓库只编译斐讯 N1（S905D），不含其它硬件
