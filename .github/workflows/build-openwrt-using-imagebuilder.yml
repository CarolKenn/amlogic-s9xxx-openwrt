#=====================================================================================
# https://github.com/CarolKenn/amlogic-s9xxx-openwrt
# Description:   斐讯 N1（S905D）专用：用官方 ImageBuilder 构建 ImmortalWrt rootfs 并打包
# Source:        https://downloads.immortalwrt.org/releases
# Note:          23.05.4 的 ImageBuilder 是 .tar.xz，24.10+ 是 .tar.zst，脚本自动识别
#=====================================================================================

name: Build ImmortalWrt for Phicomm N1 (ImageBuilder)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      releases_branch:
        description: "选择 ImmortalWrt 版本"
        required: false
        default: "immortalwrt:24.10.6"
        type: choice
        options:
          - immortalwrt:24.10.6
          - immortalwrt:23.05.4
      openwrt_kernel:
        description: "选择内核版本（flippy）"
        required: false
        default: "6.6.y"
        type: choice
        options:
          - 5.15.y
          - 6.6.y
          - 6.12.y
      kernel_usage:
        description: "内核标签"
        required: false
        default: "flippy"
        type: choice
        options:
          - flippy
          - stable
          - beta
      openwrt_ip:
        description: "设置固件默认 IP（旁路由形态）"
        required: false
        default: "192.168.128.3"
      builder_name:
        description: "固件签名"
        required: false
        default: "ophub"
        type: choice
        options:
          - ophub
          - angel
          - yourname

env:
  TZ: Etc/UTC
  IMAGEBUILDER_SH: config/imagebuilder/imagebuilder.sh

jobs:
  build:
    runs-on: ubuntu-26.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write
    env:
      # repository_dispatch 没有 inputs，用 client_payload 或直接回落默认值
      RELEASES_BRANCH: ${{ inputs.releases_branch || github.event.client_payload.releases_branch || 'immortalwrt:24.10.6' }}
      OPENWRT_KERNEL: ${{ inputs.openwrt_kernel || github.event.client_payload.openwrt_kernel || '6.6.y' }}
      KERNEL_USAGE: ${{ inputs.kernel_usage || github.event.client_payload.kernel_usage || 'flippy' }}
      OPENWRT_IP: ${{ inputs.openwrt_ip || github.event.client_payload.openwrt_ip || '192.168.128.3' }}
      BUILDER_NAME: ${{ inputs.builder_name || github.event.client_payload.builder_name || 'ophub' }}
      OPENWRT_BOARD: s905d

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-make-openwrt-depends)
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          date -u
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }
          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Build N1 rootfs [ ${{ env.RELEASES_BRANCH }} ]
        id: imagebuilder
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          chmod +x "${IMAGEBUILDER_SH}"
          "${IMAGEBUILDER_SH}" "${RELEASES_BRANCH}"
          # 校验 ImageBuilder 确实产出了 rootfs.tar.gz
          rootfs="$(ls -1 output/*rootfs.tar.gz 2>/dev/null | head -n1)"
          [[ -f "${rootfs}" ]] || { echo "No rootfs.tar.gz in output/"; ls -lh output/; exit 1; }
          echo "Found rootfs: ${rootfs}"
          tag="N1_${RELEASES_BRANCH/:/_}_$(date +"%Y.%m.%d")"
          echo "build_tag=${tag}" >> ${GITHUB_ENV}
          df -hT ${PWD}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Upload rootfs to Release
        uses: ophub/upload-to-releases@main
        if: ${{ steps.imagebuilder.outputs.status == 'success' && !cancelled() }}
        with:
          tag: ${{ env.build_tag }}
          artifacts: output/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package N1 image (s905d only)
        if: ${{ steps.imagebuilder.outputs.status == 'success' && !cancelled() }}
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: output/*rootfs.tar.gz
          openwrt_board: ${{ env.OPENWRT_BOARD }}
          openwrt_kernel: ${{ env.OPENWRT_KERNEL }}
          auto_kernel: true
          kernel_repo: ophub/kernel
          kernel_usage: ${{ env.KERNEL_USAGE }}
          openwrt_ip: ${{ env.OPENWRT_IP }}
          openwrt_size: 384/2048
          builder_name: ${{ env.BUILDER_NAME }}

      - name: Upload N1 firmware to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: ${{ env.build_tag }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### 斐讯 N1（S905D）ImmortalWrt 固件

            - 源码：${{ env.RELEASES_BRANCH }}（官方 ImageBuilder）
            - 内核：${{ env.OPENWRT_KERNEL }}（${{ env.KERNEL_USAGE }}）
            - 默认 IP：`${{ env.OPENWRT_IP }}`，LuCI 端口 `8080`
            - 默认账号：`root`，密码：`password`
            - 形态：旁路由（DHCP 关闭、网关/DNS 指向主路由）
            - 内置：Docker、Samba4 共享 `/mnt/movie`、NTFS3/exFAT/F2FS、HD-idle
            - 写 eMMC：系统 → 晶晨宝盒 → 安装 OpenWrt 到 eMMC

            外接硬盘请使用带独立供电的硬盘盒；UAS 掉盘时执行 `n1-storage usb-quirks <VID:PID>`。
